<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amplop Selamat Hari</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .envelope {
            width: 300px;
            height: 200px;
            border: 2px solid #333;
            border-radius: 10px;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .envelope:before {
            content: '';
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            height: 20px;
            background-color: #333;
            border-radius: 10px 10px 0 0;
        }
        .message {
            padding: 20px;
            text-align: center;
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>
    <background-color:#D8BFD8
    <div class="envelope">
        <div class="message">
            Selamat Hari VVvv....<br>JUMAT!!!
        </div>
    </div>
</body>
</html>
